[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# /api/* is served by the Netlify Function itself (config.path in netlify/functions/api.mts),
# so no redirect rule is needed for it. Only the SPA fallback stays.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

